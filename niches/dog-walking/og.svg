<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Bluebird &amp; Biscuit Pet Care — Happy dogs, easy weeks.">
  <title>Bluebird &amp; Biscuit Pet Care</title>
  <defs>
    <linearGradient id="dog-walking-og-ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDFEFF"/>
      <stop offset="0.55" stop-color="#F7FAFD"/>
      <stop offset="1" stop-color="#FDFEFF"/>
    </linearGradient>
    <radialGradient id="dog-walking-og-glow" cx="0.86" cy="-0.08" r="0.75">
      <stop offset="0" stop-color="#3B9AE1" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#3B9AE1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dog-walking-og-glow2" cx="0.04" cy="1.05" r="0.6">
      <stop offset="0" stop-color="#3B9AE1" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#3B9AE1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#dog-walking-og-ground)"/>
  <rect width="1200" height="630" fill="url(#dog-walking-og-glow)"/>
  <rect width="1200" height="630" fill="url(#dog-walking-og-glow2)"/>

  <!-- accent spine, left edge -->
  <rect x="0" y="0" width="10" height="630" fill="#3B9AE1"/>

  <!-- eyebrow: where they work -->
  <text x="90" y="140" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="21"
        letter-spacing="4.6" fill="#5A6B7B">TREASURE VALLEY, IDAHO</text>

  <!-- headline: the business -->
  <text x="90" y="300" font-family="'Baloo 2', Georgia, serif" font-size="78" font-weight="800" fill="#22364A">Bluebird &amp; Biscuit Pet</text>
  <text x="90" y="382.68" font-family="'Baloo 2', Georgia, serif" font-size="78" font-weight="800" fill="#22364A">Care</text>

  <!-- accent rule -->
  <rect x="90" y="426.68" width="132" height="7" fill="#3B9AE1"/>

  <!-- tagline -->
  <text x="90" y="498.68" font-family="Varela Round, system-ui, sans-serif" font-size="34" fill="#5A6B7B">Happy dogs, easy weeks.</text>

  <!-- footer rule -->
  <rect x="90" y="536" width="1020" height="1" fill="#22364A" opacity="0.16"/>

  <!-- wordmark -->
  <circle cx="97" cy="577" r="7" fill="#3B9AE1"/>
  <text x="116" y="584" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="20"
        letter-spacing="3.4" fill="#5A6B7B">SYSTEMS BY VEGA</text>

  
</svg>
