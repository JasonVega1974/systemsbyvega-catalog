<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Pane &amp; Prairie Window Co. — Glass you forget is there.">
  <title>Pane &amp; Prairie Window Co.</title>
  <defs>
    <linearGradient id="window-cleaning-og-ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCFEFF"/>
      <stop offset="0.55" stop-color="#F3F9FB"/>
      <stop offset="1" stop-color="#DFECF1"/>
    </linearGradient>
    <radialGradient id="window-cleaning-og-glow" cx="0.86" cy="-0.08" r="0.75">
      <stop offset="0" stop-color="#22ACC4" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22ACC4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="window-cleaning-og-glow2" cx="0.04" cy="1.05" r="0.6">
      <stop offset="0" stop-color="#22ACC4" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#22ACC4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#window-cleaning-og-ground)"/>
  <rect width="1200" height="630" fill="url(#window-cleaning-og-glow)"/>
  <rect width="1200" height="630" fill="url(#window-cleaning-og-glow2)"/>

  <!-- accent spine, left edge -->
  <rect x="0" y="0" width="10" height="630" fill="#22ACC4"/>

  <!-- eyebrow: where they work -->
  <text x="90" y="140" font-family="DM Mono, ui-monospace, monospace" font-size="21"
        letter-spacing="4.6" fill="#566D74">KOOTENAI COUNTY, IDAHO</text>

  <!-- headline: the business -->
  <text x="90" y="300" font-family="Outfit, Georgia, serif" font-size="78" font-weight="800" fill="#16272E">Pane &amp; Prairie Window</text>
  <text x="90" y="382.68" font-family="Outfit, Georgia, serif" font-size="78" font-weight="800" fill="#16272E">Co.</text>

  <!-- accent rule -->
  <rect x="90" y="426.68" width="132" height="7" fill="#22ACC4"/>

  <!-- tagline -->
  <text x="90" y="498.68" font-family="Figtree, system-ui, sans-serif" font-size="34" fill="#42575F">Glass you forget is there.</text>

  <!-- footer rule -->
  <rect x="90" y="536" width="1020" height="1" fill="#16272E" opacity="0.16"/>

  <!-- wordmark -->
  <circle cx="97" cy="577" r="7" fill="#22ACC4"/>
  <text x="116" y="584" font-family="DM Mono, ui-monospace, monospace" font-size="20"
        letter-spacing="3.4" fill="#566D74">SYSTEMS BY VEGA</text>

  
</svg>
