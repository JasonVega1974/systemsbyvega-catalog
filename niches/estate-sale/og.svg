<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Magpie &amp; Mantel Estate Sales — The whole house, handled with care.">
  <title>Magpie &amp; Mantel Estate Sales</title>
  <defs>
    <linearGradient id="estate-sale-og-ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F1D1A"/>
      <stop offset="0.55" stop-color="#0C1614"/>
      <stop offset="1" stop-color="#081010"/>
    </linearGradient>
    <radialGradient id="estate-sale-og-glow" cx="0.86" cy="-0.08" r="0.75">
      <stop offset="0" stop-color="#C89A3F" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#C89A3F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="estate-sale-og-glow2" cx="0.04" cy="1.05" r="0.6">
      <stop offset="0" stop-color="#C89A3F" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#C89A3F" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#estate-sale-og-ground)"/>
  <rect width="1200" height="630" fill="url(#estate-sale-og-glow)"/>
  <rect width="1200" height="630" fill="url(#estate-sale-og-glow2)"/>

  <!-- accent spine, left edge -->
  <rect x="0" y="0" width="10" height="630" fill="#C89A3F"/>

  <!-- eyebrow: where they work -->
  <text x="90" y="140" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="21"
        letter-spacing="4.6" fill="#8FA098">MAGIC VALLEY, IDAHO</text>

  <!-- headline: the business -->
  <text x="90" y="300" font-family="Fraunces, Georgia, serif" font-size="78" font-weight="800" fill="#F2EDE0">Magpie &amp; Mantel Estate</text>
  <text x="90" y="382.68" font-family="Fraunces, Georgia, serif" font-size="78" font-weight="800" fill="#F2EDE0">Sales</text>

  <!-- accent rule -->
  <rect x="90" y="426.68" width="132" height="7" fill="#C89A3F"/>

  <!-- tagline -->
  <text x="90" y="498.68" font-family="Karla, system-ui, sans-serif" font-size="34" fill="#C4CFC8">The whole house, handled with care.</text>

  <!-- footer rule -->
  <rect x="90" y="536" width="1020" height="1" fill="#F2EDE0" opacity="0.16"/>

  <!-- wordmark -->
  <circle cx="97" cy="577" r="7" fill="#C89A3F"/>
  <text x="116" y="584" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="20"
        letter-spacing="3.4" fill="#8FA098">SYSTEMS BY VEGA</text>

  
</svg>
