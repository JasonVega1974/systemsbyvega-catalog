<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Cedar &amp; Filament Holiday Lighting — Hung in November. Serviced all season. Gone by mid-January.">
  <title>Cedar &amp; Filament Holiday Lighting</title>
  <defs>
    <linearGradient id="christmas-lights-og-ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12262F"/>
      <stop offset="0.55" stop-color="#0C1A20"/>
      <stop offset="1" stop-color="#071216"/>
    </linearGradient>
    <radialGradient id="christmas-lights-og-glow" cx="0.86" cy="-0.08" r="0.75">
      <stop offset="0" stop-color="#E8B04B" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#E8B04B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="christmas-lights-og-glow2" cx="0.04" cy="1.05" r="0.6">
      <stop offset="0" stop-color="#E8B04B" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#E8B04B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#christmas-lights-og-ground)"/>
  <rect width="1200" height="630" fill="url(#christmas-lights-og-glow)"/>
  <rect width="1200" height="630" fill="url(#christmas-lights-og-glow2)"/>

  <!-- accent spine, left edge -->
  <rect x="0" y="0" width="10" height="630" fill="#E8B04B"/>

  <!-- eyebrow: where they work -->
  <text x="90" y="140" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="21"
        letter-spacing="4.6" fill="#9DB4BE">SANDPOINT AND THE BONNER COUNTY LAKESHORE</text>

  <!-- headline: the business -->
  <text x="90" y="300" font-family="Fraunces, Georgia, serif" font-size="78" font-weight="800" fill="#EAF2F5">Cedar &amp; Filament</text>
  <text x="90" y="382.68" font-family="Fraunces, Georgia, serif" font-size="78" font-weight="800" fill="#EAF2F5">Holiday Lighting</text>

  <!-- accent rule -->
  <rect x="90" y="426.68" width="132" height="7" fill="#E8B04B"/>

  <!-- tagline -->
  <text x="90" y="498.68" font-family="'Source Sans 3', system-ui, sans-serif" font-size="34" fill="#C3D5DC">Hung in November. Serviced all season. Gone by</text>
  <text x="90" y="544.6800000000001" font-family="'Source Sans 3', system-ui, sans-serif" font-size="34" fill="#C3D5DC">mid-January.</text>

  <!-- footer rule -->
  <rect x="90" y="563" width="1020" height="1" fill="#EAF2F5" opacity="0.16"/>

  <!-- wordmark -->
  <circle cx="97" cy="577" r="7" fill="#E8B04B"/>
  <text x="116" y="584" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="20"
        letter-spacing="3.4" fill="#9DB4BE">SYSTEMS BY VEGA</text>

  
</svg>
