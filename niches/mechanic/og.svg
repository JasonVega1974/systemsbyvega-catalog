<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Gravel &amp; Gasket Mobile Mechanic — The shop comes to your driveway.">
  <title>Gravel &amp; Gasket Mobile Mechanic</title>
  <defs>
    <linearGradient id="mechanic-og-ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#131917"/>
      <stop offset="0.55" stop-color="#0D1110"/>
      <stop offset="1" stop-color="#070A09"/>
    </linearGradient>
    <radialGradient id="mechanic-og-glow" cx="0.86" cy="-0.08" r="0.75">
      <stop offset="0" stop-color="#2FA85D" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2FA85D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mechanic-og-glow2" cx="0.04" cy="1.05" r="0.6">
      <stop offset="0" stop-color="#2FA85D" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#2FA85D" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#mechanic-og-ground)"/>
  <rect width="1200" height="630" fill="url(#mechanic-og-glow)"/>
  <rect width="1200" height="630" fill="url(#mechanic-og-glow2)"/>

  <!-- accent spine, left edge -->
  <rect x="0" y="0" width="10" height="630" fill="#2FA85D"/>

  <!-- eyebrow: where they work -->
  <text x="90" y="140" font-family="Space Mono, ui-monospace, monospace" font-size="21"
        letter-spacing="4.6" fill="#889892">PAYETTE AND WASHINGTON COUNTIES, IDAHO</text>

  <!-- headline: the business -->
  <text x="90" y="300" font-family="Archivo Black, Georgia, serif" font-size="78" font-weight="800" fill="#EFF3F0">Gravel &amp; Gasket Mobile</text>
  <text x="90" y="382.68" font-family="Archivo Black, Georgia, serif" font-size="78" font-weight="800" fill="#EFF3F0">Mechanic</text>

  <!-- accent rule -->
  <rect x="90" y="426.68" width="132" height="7" fill="#2FA85D"/>

  <!-- tagline -->
  <text x="90" y="498.68" font-family="Barlow, system-ui, sans-serif" font-size="34" fill="#B4C2BB">The shop comes to your driveway.</text>

  <!-- footer rule -->
  <rect x="90" y="536" width="1020" height="1" fill="#EFF3F0" opacity="0.16"/>

  <!-- wordmark -->
  <circle cx="97" cy="577" r="7" fill="#2FA85D"/>
  <text x="116" y="584" font-family="Space Mono, ui-monospace, monospace" font-size="20"
        letter-spacing="3.4" fill="#889892">SYSTEMS BY VEGA</text>

  
</svg>
