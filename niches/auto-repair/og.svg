<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Rimrock Garage — Fixed right. Explained first.">
  <title>Rimrock Garage</title>
  <defs>
    <linearGradient id="auto-repair-og-ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF7EC"/>
      <stop offset="0.55" stop-color="#F5EFE2"/>
      <stop offset="1" stop-color="#FBF7EC"/>
    </linearGradient>
    <radialGradient id="auto-repair-og-glow" cx="0.86" cy="-0.08" r="0.75">
      <stop offset="0" stop-color="#B3271E" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#B3271E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auto-repair-og-glow2" cx="0.04" cy="1.05" r="0.6">
      <stop offset="0" stop-color="#B3271E" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#B3271E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#auto-repair-og-ground)"/>
  <rect width="1200" height="630" fill="url(#auto-repair-og-glow)"/>
  <rect width="1200" height="630" fill="url(#auto-repair-og-glow2)"/>

  <!-- accent spine, left edge -->
  <rect x="0" y="0" width="10" height="630" fill="#B3271E"/>

  <!-- eyebrow: where they work -->
  <text x="90" y="140" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="21"
        letter-spacing="4.6" fill="#6E6152">WESTERN TREASURE VALLEY, IDAHO</text>

  <!-- headline: the business -->
  <text x="90" y="330" font-family="Zilla Slab, Georgia, serif" font-size="96" font-weight="800" fill="#2A2118">Rimrock Garage</text>

  <!-- accent rule -->
  <rect x="90" y="374" width="132" height="7" fill="#B3271E"/>

  <!-- tagline -->
  <text x="90" y="446" font-family="'Source Sans 3', system-ui, sans-serif" font-size="34" fill="#6E6152">Fixed right. Explained first.</text>

  <!-- footer rule -->
  <rect x="90" y="536" width="1020" height="1" fill="#2A2118" opacity="0.16"/>

  <!-- wordmark -->
  <circle cx="97" cy="577" r="7" fill="#B3271E"/>
  <text x="116" y="584" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="20"
        letter-spacing="3.4" fill="#6E6152">SYSTEMS BY VEGA</text>

  
</svg>
