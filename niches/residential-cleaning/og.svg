<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Yarrow &amp; Broom Cleaning Co. — A house that feels like a fresh start.">
  <title>Yarrow &amp; Broom Cleaning Co.</title>
  <defs>
    <linearGradient id="residential-cleaning-og-ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#F2FAF6"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <radialGradient id="residential-cleaning-og-glow" cx="0.86" cy="-0.08" r="0.75">
      <stop offset="0" stop-color="#08694A" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#08694A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="residential-cleaning-og-glow2" cx="0.04" cy="1.05" r="0.6">
      <stop offset="0" stop-color="#08694A" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#08694A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#residential-cleaning-og-ground)"/>
  <rect width="1200" height="630" fill="url(#residential-cleaning-og-glow)"/>
  <rect width="1200" height="630" fill="url(#residential-cleaning-og-glow2)"/>

  <!-- accent spine, left edge -->
  <rect x="0" y="0" width="10" height="630" fill="#08694A"/>

  <!-- eyebrow: where they work -->
  <text x="90" y="140" font-family="Space Mono, ui-monospace, monospace" font-size="21"
        letter-spacing="4.6" fill="#4C6A5D">ELMORE COUNTY, IDAHO</text>

  <!-- headline: the business -->
  <text x="90" y="300" font-family="Outfit, Georgia, serif" font-size="78" font-weight="800" fill="#10251D">Yarrow &amp; Broom</text>
  <text x="90" y="382.68" font-family="Outfit, Georgia, serif" font-size="78" font-weight="800" fill="#10251D">Cleaning Co.</text>

  <!-- accent rule -->
  <rect x="90" y="426.68" width="132" height="7" fill="#08694A"/>

  <!-- tagline -->
  <text x="90" y="498.68" font-family="Manrope, system-ui, sans-serif" font-size="34" fill="#37564A">A house that feels like a fresh start.</text>

  <!-- footer rule -->
  <rect x="90" y="536" width="1020" height="1" fill="#10251D" opacity="0.16"/>

  <!-- wordmark -->
  <circle cx="97" cy="577" r="7" fill="#08694A"/>
  <text x="116" y="584" font-family="Space Mono, ui-monospace, monospace" font-size="20"
        letter-spacing="3.4" fill="#4C6A5D">SYSTEMS BY VEGA</text>

  <text x="1110" y="584" text-anchor="end" font-family="Space Mono, ui-monospace, monospace" font-size="20"
        letter-spacing="1.6" fill="#08694A">$129–$289</text>
</svg>
