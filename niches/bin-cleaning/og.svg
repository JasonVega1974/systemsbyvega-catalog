<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Prime Bin Cleaning — Clean bins. Fresher homes.">
  <title>Prime Bin Cleaning</title>
  <defs>
    <linearGradient id="bin-cleaning-og-ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a2138"/>
      <stop offset="0.55" stop-color="#050f1c"/>
      <stop offset="1" stop-color="#04101f"/>
    </linearGradient>
    <radialGradient id="bin-cleaning-og-glow" cx="0.86" cy="-0.08" r="0.75">
      <stop offset="0" stop-color="#4ea4e6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#4ea4e6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bin-cleaning-og-glow2" cx="0.04" cy="1.05" r="0.6">
      <stop offset="0" stop-color="#4ea4e6" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#4ea4e6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bin-cleaning-og-ground)"/>
  <rect width="1200" height="630" fill="url(#bin-cleaning-og-glow)"/>
  <rect width="1200" height="630" fill="url(#bin-cleaning-og-glow2)"/>

  <!-- accent spine, left edge -->
  <rect x="0" y="0" width="10" height="630" fill="#4ea4e6"/>

  <!-- eyebrow: where they work -->
  <text x="90" y="140" font-family="Oswald, ui-monospace, monospace" font-size="21"
        letter-spacing="4.6" fill="#8fb2cf">NAMPA &amp; CALDWELL, IDAHO</text>

  <!-- headline: the business -->
  <text x="90" y="330" font-family="Anton, Georgia, serif" font-size="96" font-weight="800" fill="#f2f9ff">Prime Bin Cleaning</text>

  <!-- accent rule -->
  <rect x="90" y="374" width="132" height="7" fill="#4ea4e6"/>

  <!-- tagline -->
  <text x="90" y="446" font-family="Inter, system-ui, sans-serif" font-size="34" fill="#bfe3fb">Clean bins. Fresher homes.</text>

  <!-- footer rule -->
  <rect x="90" y="536" width="1020" height="1" fill="#f2f9ff" opacity="0.16"/>

  <!-- wordmark -->
  <circle cx="97" cy="577" r="7" fill="#4ea4e6"/>
  <text x="116" y="584" font-family="Oswald, ui-monospace, monospace" font-size="20"
        letter-spacing="3.4" fill="#8fb2cf">SYSTEMS BY VEGA</text>

  <text x="1110" y="584" text-anchor="end" font-family="Oswald, ui-monospace, monospace" font-size="20"
        letter-spacing="1.6" fill="#4ea4e6">$10-$25</text>
</svg>
