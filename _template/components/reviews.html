<!-- _template/components/reviews.html
     Three review cards filled from c.testimonials. The fallback strings for
     an empty card live in reviews.js, set via textContent -- NOT a CSS
     :empty::before pseudo-element (bin-cleaning's original approach): a
     property assignment is the escaping standard for every new sink in this
     build, and it means the fallback copy exists in the DOM regardless of
     what CSS a given niche happens to ship. -->
<div class="reviews-cmp-grid">
  <div class="review-cmp reveal" data-delay="1">
    <span class="review-cmp__mark" aria-hidden="true">&ldquo;</span>
    <div class="review-cmp__quote"></div>
    <div class="review-cmp__who"></div>
  </div>
  <div class="review-cmp reveal" data-delay="2">
    <span class="review-cmp__mark" aria-hidden="true">&ldquo;</span>
    <div class="review-cmp__quote"></div>
    <div class="review-cmp__who"></div>
  </div>
  <div class="review-cmp reveal" data-delay="3">
    <span class="review-cmp__mark" aria-hidden="true">&ldquo;</span>
    <div class="review-cmp__quote"></div>
    <div class="review-cmp__who"></div>
  </div>
</div>
