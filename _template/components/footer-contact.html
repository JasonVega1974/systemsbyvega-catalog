<!-- _template/components/footer-contact.html
     Fragment meant to sit inside an existing niche's footer, wherever that
     niche's sections.html carries the footer-contact slot comment (typically
     beside the phone/email/serve-area lines already in footer__meta).
     Populated by initFooterContact(c) in footer-contact.js. Each line starts
     hidden and is revealed only when its own data is present, so an empty
     demo (or an operator who hasn't filled in hours or an address yet) shows
     nothing here at all -- no half-filled contact block, no dangling label
     with nothing after it. -->
<p class="fc-hours" id="fcHours" hidden></p>
<p class="fc-address" id="fcAddress" hidden></p>
<p class="fc-social" id="fcSocial" hidden></p>
