<noscript><style>.reveal{opacity:1 !important;transform:none !important}</style></noscript>
<!-- Vercel Analytics. Same-origin, cookieless, and defer so it never
     blocks a first paint. Root-relative so the one tag works on the apex
     and on every tenant subdomain without knowing which it is on. -->
<script>
/* Top frame only. /sites/ embeds ~32 storefronts as iframes, and an unguarded
   tag made every one of them report its own page view — inflating the numbers
   and attributing traffic to sites nobody actually opened. */
(function () {
  if (window.self !== window.top) return;
  var s = document.createElement("script");
  s.defer = true;
  s.src = "/_vercel/insights/script.js";
  document.head.appendChild(s);
}());
</script>
</head>
<body>
{{DEMO_BANNER}}

{{SCENE_SVG}}

{{SECTIONS}}

<script>
/* Inlined from niches/{{SLUG}}/content.json by tools/build-site.js.
   DO NOT EDIT — edit content.json. These two cannot drift: one generates the other. */
var DEFAULT_CONTENT = {{DEFAULT_CONTENT}};
</script>

<!-- SCRIPT ORDER IS LOAD-BEARING. base.js FIRST.
     Every niche.js opens with `var SL = window.SL;`, and base.js assigns
     window.SL at the end of its IIFE. With base.js emitted last, SL was
     undefined when niche.js ran: every renderer threw on its first line,
     window.renderContent was never defined, and base.js then skipped it via its
     own typeof guard — silently, on all 14 converted sites.
     base.js defers boot() to DOMContentLoaded, so renderContent and initScene
     are both defined by the time it fires. Do not reorder these. -->
<script>
{{BASE_JS}}
</script>

<script>
{{NICHE_JS}}
</script>

<script>
{{SCENE_JS}}
</script>

</body>
